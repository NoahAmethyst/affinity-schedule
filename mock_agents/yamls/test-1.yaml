apiVersion: v1
kind: Pod
metadata:
  name: agent-2
  labels:
    app: agent-2
spec:
  nodeName: pasak8s-14
  containers:
    - name: agent-2
      image: agent:v0.4
      command: ["sleep"]
      args: ["36000"]
      ports:
      - containerPort: 11111
      - containerPort: 11112
---
apiVersion: v1
kind: Service
metadata:
  name: service-2
  labels:
    app: agent-2
spec:
  selector:
    app: agent-2
  ports:
    - protocol: TCP
      port: 11111  # 对外提供服务的端口，可以根据实际需求修改
      targetPort: 11111  # Pod 内实际监听的端口，要和 Pod 中应用监听的端口对应
      name: server
    - protocol: TCP
      port: 11112  # 对外提供服务的端口，可以根据实际需求修改
      targetPort: 11112  # Pod 内实际监听的端口，要和 Pod 中应用监听的端口对应
      name: metrics
  type: ClusterIP  # 服务类型，这里使用 ClusterIP，可根据需求换成其他类型（如 NodePort、LoadBalancer 等）