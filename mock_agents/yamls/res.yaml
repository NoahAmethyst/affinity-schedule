
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-1
  labels:
    app: pod-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-1
  template:
    metadata:
      name: pod-1
      labels:
        app: pod-1
    spec:
      nodeName: pasak8s-14
      containers:
        - name: pod-1
          image: agent:v0.4
          command: ["python3", "/agent/main.py", "-c", "4", "-m", "4", "-f", "3.0", "-p", "100", "-t", "pod-2", "-a", "10000"]
          ports:
          - containerPort: 11111
          - containerPort: 11112
---
apiVersion: v1
kind: Service
metadata:
  name: pod-1
  labels:
    app: agents
spec:
  selector:
    app: pod-1
  ports:
    - protocol: TCP
      port: 11111  # 对外提供服务的端口，可以根据实际需求修改
      targetPort: 11111  # Pod 内实际监听的端口，要和 Pod 中应用监听的端口对应
      name: server
    - protocol: TCP
      port: 11112  # 对外提供服务的端口，可以根据实际需求修改
      targetPort: 11112  # Pod 内实际监听的端口，要和 Pod 中应用监听的端口对应
      name: metrics
  type: ClusterIP  # 服务类型，这里使用 ClusterIP，可根据需求换成其他类型（如 NodePort、LoadBalancer 等）
